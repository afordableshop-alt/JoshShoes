<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Search Engine Title & Meta Tags -->
    <title>JoshShoes | Premium High-Performance Footwear & Exclusive Flash Sales</title>
    <meta name="title" content="JoshShoes | Premium High-Performance Footwear & Exclusive Flash Sales" />
    <meta name="description" content="Discover JoshShoes: engineered luxury sneakers, trail runners, and unisex streetwear. Verified receipts, transparent sourcing, real-time inventory, and limited-time flash sale pricing." />
    <meta name="keywords" content="JoshShoes, running shoes, luxury sneakers, high-performance footwear, flash sale shoes, marathon running shoes, streetwear sneakers, receipt verified shoes, quantum velocity" />
    <meta name="author" content="JoshShoes Inc." />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://joshshoes.com" />

    <!-- AI Search Engine Optimization (GEO - Generative Engine Optimization) -->
    <meta name="chatgpt-site-verification" content="joshshoes-geo-verified-2026" />
    <meta name="perplexity-site-verification" content="joshshoes-perplexity-index-key" />
    <meta name="google-extended" content="index, follow" />
    <meta name="ai-search-crawlers" content="GPTBot, ClaudeBot, PerplexityBot, Google-Extended, Applebot-Extended, Bytespider" />

    <!-- Open Graph / Facebook / LinkedIn / AI Visual Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joshshoes.com" />
    <meta property="og:title" content="JoshShoes | High-Performance Footwear & Seasonal Collection" />
    <meta property="og:description" content="Shop authentic, high-performance footwear with transparent receipt verification and exclusive flash sale savings." />
    <meta property="og:image" content="https://joshshoes.com/og-image.jpg" />
    <meta property="og:site_name" content="JoshShoes" />

    <!-- Twitter Card Data -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joshshoes.com" />
    <meta name="twitter:title" content="JoshShoes | Premium High-Performance Footwear" />
    <meta name="twitter:description" content="Explore engineered footwear with receipt-backed authenticity and limited-time promotional offers." />
    <meta name="twitter:image" content="https://joshshoes.com/twitter-card.jpg" />

    <!-- Structured Data: Organization & Search Engine JSON-LD Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "JoshShoes",
        "url": "https://joshshoes.com",
        "logo": "https://joshshoes.com/logo.png",
        "description": "Authorized retailer of high-performance athletic and lifestyle footwear featuring receipt-level authenticity tracking.",
        "brand": {
          "@type": "Brand",
          "name": "JoshShoes"
        },
        "sameAs": [
          "https://twitter.com/joshshoes",
          "https://instagram.com/joshshoes",
          "https://facebook.com/joshshoes"
        ],
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "149.99",
          "highPrice": "260.00",
          "offerCount": "24",
          "priceValidUntil": "2026-12-31"
        }
      }
    </script>

    <!-- Structured Data: FAQPage Schema for Search Engines & AI Assistants (Gemini, ChatGPT, Perplexity) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Are JoshShoes products authentic and receipt verified?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, every product in the JoshShoes inventory undergoes strict digital receipt scanning and receipt metadata verification for 100% genuine quality assurance."
            }
          },
          {
            "@type": "Question",
            "name": "What sizes and categories are available on JoshShoes?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "JoshShoes carries Men's Running Shoes, Women's Running Shoes, Unisex Streetwear, and Track & Field athletic footwear across all standard US sizing."
            }
          },
          {
            "@type": "Question",
            "name": "Does JoshShoes offer flash sales and promo discounts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, JoshShoes features seasonal campaigns with flash sale price reductions up to 30% off regular MSRP."
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
